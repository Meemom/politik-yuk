name: Provider Smoke

on:
  workflow_dispatch:

jobs:
  provider-smoke:
    name: Provider Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aya_context
          POSTGRES_USER: aya
          POSTGRES_PASSWORD: aya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aya -d aya_context"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:7.2.0-v10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: provider-smoke
      POSTGRES_URL: postgresql://aya:aya@localhost:5432/aya_context
      REDIS_URL: redis://localhost:6379/0
      GRAPH_CHECKPOINT_BACKEND: redis
      MODEL_PROVIDER_BACKEND: cohere
      EXTERNAL_SEARCH_PROVIDER: tavily
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run migrations
        run: python -m app.persistence.cli migrate

      - name: Verify required secrets
        run: |
          test -n "$COHERE_API_KEY"
          test -n "$TAVILY_API_KEY"

      - name: Provider smoke tests
        run: pytest -m live_provider_smoke
